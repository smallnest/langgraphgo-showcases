version: '3.8'

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notebook-postgres
    environment:
      POSTGRES_DB: notebook
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (optional, for caching)
  redis:
    image: redis:7-alpine
    container_name: notebook-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Open Notebook Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-notebook
    environment:
      # Server
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080

      # LLM (choose one)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}

      # Vector Store
      - VECTOR_STORE_TYPE=postgres
      - POSTGRES_URL=postgres://notebook:secret@postgres:5432/notebook

      # Store
      - STORE_TYPE=sqlite
      - STORE_PATH=/data/checkpoints.db

    ports:
      - "8080:8080"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Ollama (optional, for local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: notebook-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  app-data:
  ollama-data:
